<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Surtidor Cochabambino — SCADA</title>
  
  <!-- PWA & Meta Tags -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/imagen/yautja2.png" />
  <link rel="icon" type="image/png" href="/imagen/yautja2.png" />

  <!-- FontAwesome CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Librerías Externas -->
  <script src="https://cdn.plot.ly/plotly-3.1.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Tailwind CSS & Estilos Propios -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/input.css" />
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Componentes globales montados dinámicamente -->
  <div id="app-sidebar"></div>
  <div id="app-navbar"></div>

  <!-- Contenedor Principal dinámico (Vistas) -->
  <main id="main-content"></main>

  <!-- Script del Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker en Vercel:', reg.scope))
          .catch((err) => console.error('Error al registrar SW:', err));
      });
    }

    // Manejo de la instalación PWA
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA lista para instalar');
    });
  </script>

  <!-- Script Principal de Inicio (ES6 Modules) -->
  <script type="module">
    import { renderSidebar } from '/views/componentes/sidebar.js';
    import { renderNavbar } from '/views/componentes/navbar.js';
    import { MainController } from '/controllers/mainController.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // Renderizar componentes globales
      const sidebarEl = document.getElementById('app-sidebar');
      const navbarEl = document.getElementById('app-navbar');

      if (sidebarEl) sidebarEl.innerHTML = renderSidebar();
      if (navbarEl) navbarEl.innerHTML = renderNavbar();

      // Inicializar el controlador principal
      await MainController.init();
    });
  </script>

</body>
</html>
