<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Surtidor Cochabambino — SCADA</title>
  
  <!-- FontAwesome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-3.1.1.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/input.css" />
</head>
<body>

  <!-- Componentes globales montados dinámicamente -->
  <div id="app-sidebar"></div>
  <div id="app-navbar"></div>

  <!-- Contenedor Principal dinámico (Vistas) -->
  <main id="main-content"></main>

  <!-- Script principal de inicio (ES6 Modules) -->
  <script type="module">
    import { renderSidebar } from './views/componentes/sidebar.js';
    import { renderNavbar } from './views/componentes/navbar.js';
    import { MainController } from './controllers/mainController.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Montar layout
      document.getElementById('app-sidebar').innerHTML = renderSidebar();
      document.getElementById('app-navbar').innerHTML = renderNavbar();

      // Inicializar Controlador Principal
      MainController.init();
    });
  </script>
</body>
</html>
